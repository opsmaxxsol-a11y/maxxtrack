<!DOCTYPE html>
<html>
<head>
  <title>MaxxTrack Driver</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
</head>

<body style="text-align:center; font-family:Arial">

<h2>🚚 MaxxTrack Driver App</h2>

<div id="loginBox">
  <input id="trackId" placeholder="Enter Tracking ID"/>
  <button onclick="login()">Start Tracking</button>
</div>

<p id="status"></p>
<button onclick="logout()">Logout</button>

<script>
let trackingId = localStorage.getItem("trackingId");
let lastSent = 0;

// AUTO START
window.onload = () => {
  if (trackingId) {
    document.getElementById("loginBox").style.display = "none";
    startTracking();
  }
};

// LOGIN
function login() {
  const id = document.getElementById("trackId").value;
  if (!id) return alert("Enter Tracking ID");

  localStorage.setItem("trackingId", id);
  trackingId = id;

  document.getElementById("loginBox").style.display = "none";
  startTracking();
}

// LOGOUT
function logout() {
  localStorage.removeItem("trackingId");
  location.reload();
}

// SEND LOCATION
function sendLocation(lat, lng) {
  fetch(`https://maxxtrack.onrender.com/location/${trackingId}`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ lat, lng })
  });

  document.getElementById("status").innerText =
    `📍 Sent: ${lat}, ${lng}`;
}

// START TRACKING
function startTracking() {

  if (!navigator.geolocation) {
    alert("Geolocation not supported");
    return;
  }

  navigator.geolocation.watchPosition(
    position => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      // SMART INTERVAL (10 sec)
      if (Date.now() - lastSent > 10000) {
        if (navigator.onLine) {
          sendLocation(lat, lng);
        } else {
          // SAVE OFFLINE
          localStorage.setItem("offlineLocation", JSON.stringify({lat, lng}));
        }
        lastSent = Date.now();
      }
    },
    error => {
      document.getElementById("status").innerText =
        "❌ GPS Error: " + error.message;
    },
    {
      enableHighAccuracy: true,
      maximumAge: 10000,
      timeout: 15000
    }
  );

  // SYNC OFFLINE DATA
  setInterval(() => {
    const offline = localStorage.getItem("offlineLocation");

    if (offline && navigator.onLine) {
      const {lat, lng} = JSON.parse(offline);
      sendLocation(lat, lng);
      localStorage.removeItem("offlineLocation");
    }
  }, 5000);
}

// SERVICE WORKER
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>

</body>
</html>
